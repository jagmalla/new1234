<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JIM Video Catcher</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="head">
        <img src="/icons/icon32.png" alt="" width="22" height="22" />
        <div class="titles">
          <h1>JIM Video Catcher</h1>
          <span class="version" id="version">v0.0.0</span>
        </div>
        <button class="icon-btn" id="settings" title="Settings" aria-label="Settings">⚙</button>
      </header>

      <!-- First-run legal notice -->
      <section class="notice" id="notice" hidden>
        <p>
          You are responsible for complying with the terms of service and copyright
          law of the sites you use this on. DRM-protected content is never downloaded.
        </p>
        <button class="btn btn-small" id="notice-ok">Got it</button>
      </section>

      <section class="body" id="body">
        <p class="placeholder">Scanning…</p>
      </section>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
